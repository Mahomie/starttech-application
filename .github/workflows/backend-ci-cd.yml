name: Backend CI/CD Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - "Server/**"
      - ".github/workflows/backend-ci-cd.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/muchtodo:latest ./Server/MuchToDo

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/muchtodo:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/muchtodo:latest
            docker stop app || true
            docker rm app || true
            docker run -d -p 80:8080 \
              -e MONGO_URI="${{ secrets.MONGO_URI }}" \
              -e DB_NAME="starttech" \
              --name app \
              ${{ secrets.DOCKER_USERNAME }}/muchtodo:latest
